services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paysim
      POSTGRES_USER: ${PAYSIM_DB_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${PAYSIM_DB_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:5433:5432"   # bound to localhost only; needed for running the backend outside Docker
    volumes:
      - paysim-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d paysim"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PAYSIM_DB_URL: jdbc:postgresql://db:5432/paysim
      PAYSIM_DB_USER: ${PAYSIM_DB_USER}
      PAYSIM_DB_PASSWORD: ${PAYSIM_DB_PASSWORD}
      PAYSIM_OPERATOR_USERNAME: ${PAYSIM_OPERATOR_USERNAME:-operator}
      PAYSIM_OPERATOR_PASSWORD: ${PAYSIM_OPERATOR_PASSWORD:?Copy .env.example to .env first}
      PAYSIM_VIEWER_USERNAME: ${PAYSIM_VIEWER_USERNAME:-viewer}
      PAYSIM_VIEWER_PASSWORD: ${PAYSIM_VIEWER_PASSWORD:?Copy .env.example to .env first}
      PAYSIM_CORS_ALLOWED_ORIGINS: ${PAYSIM_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      PAYSIM_SWAGGER_ENABLED: ${PAYSIM_SWAGGER_ENABLED:-true}
    ports:
      - "127.0.0.1:8081:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  paysim-data:
